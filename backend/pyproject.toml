[project]
name = "stage-controller"
version = "1.0.0"
description = "Raspberry Pi stage controller with music and device management"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0.25",
    "pydantic>=2.5.3",
    "python-multipart>=0.0.6",
    "mutagen>=1.47.0",
    "aiofiles>=23.2.1",
    "httpx>=0.27.0",
    "python-mpv>=1.0.8",
    "websockets>=17.1",
]

[project.scripts]
stage-controller = "app.main:app"

[tool.uv]
dev-dependencies = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
